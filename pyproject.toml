[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fudan-gateway"
version = "0.1.0"
description = "Per-device WebVPN resource access and native SSH through an authenticated campus relay"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "cryptography>=46,<51"]

[project.optional-dependencies]
browser = ["playwright>=1.58,<2"]

[project.scripts]
fudangateway = "fudan_gateway.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
