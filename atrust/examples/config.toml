# Private runtime configuration. UIS credentials are entered in the login window.
protocol = "atrust"
server_address = "vpn.fudan.edu.cn"
server_port = 443
auth_type = "auth/httpsOauth2"
login_domain = "id.fudan.edu.cn"
socks_bind = "127.0.0.1:1080"
http_bind = ""
dns_server_bind = ""
shadowsocks_url = ""
tcp_tunnel_mode = true
tun_mode = false
add_route = false
dns_hijack = false
fake_ip = false
proxy_all = false
dial_direct_proxy = ""
disable_zju_config = true
bind_interface = ""
auto_detect_interface = false
disable_remote_dns = false
remote_dns_server = "auto"
secondary_dns_server = "auto"
client_data_file = "client-data.json"
session_refresh_interval = 1800
update_best_nodes_interval = 1800
disable_keep_alive = true
debug_dump = false
debug_pcap_file = ""
debug_tls_log_file = ""
